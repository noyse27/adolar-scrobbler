services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adolar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adolar}
      POSTGRES_DB: adolar_scrobbler
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adolar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://adolar:${POSTGRES_PASSWORD:-adolar}@db:5432/adolar_scrobbler
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?set a long random COOKIE_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      PORT: 4000
    ports:
      - "${HOST_PORT:-4000}:4000"

volumes:
  db-data:
