name: adolar-scrobbler-ci

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adolar
          POSTGRES_PASSWORD: adolar
          POSTGRES_DB: adolar_scrobbler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adolar -d adolar_scrobbler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://adolar:adolar@localhost:5432/adolar_scrobbler
      JWT_SECRET: ci-test-secret
      COOKIE_SECRET: ci-test-cookie-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck server
        run: npx -w server tsc --noEmit

      - name: Typecheck web
        run: npx -w web tsc -b

      - name: Run migrations
        run: npx -w server prisma migrate deploy

      - name: Unit tests
        run: npm run test --if-present

      - name: Build
        run: npm run build

  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks diffs against the parent commit on PR events; a
          # shallow checkout has no parent commit to diff against.
          fetch-depth: 0

      - name: Trivy file system scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  docker-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t adolar-scrobbler:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'adolar-scrobbler:ci'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
